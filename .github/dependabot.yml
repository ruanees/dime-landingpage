# Atualizações automáticas de dependências (I-04). Toda segunda de manhã o
# Dependabot abre PRs; a CI confere, e o Jimmy põe no checklist.
# Alertas de segurança chegam a qualquer hora, fora deste calendário.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Versão grande (major) vira item no checklist e é feita com calma, não por PR
    # automático. Alertas de segurança continuam chegando à parte.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
